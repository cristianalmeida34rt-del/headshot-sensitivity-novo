
name: Build Headshot Sensitivity APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses || true

            - name: Conferir AndroidManifest
        run: |
          echo "===== INICIO DO MANIFEST ====="
          cat -n app/src/main/AndroidManifest.xml
          echo "===== FIM DO MANIFEST ====="

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace --info

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Headshot-Sensitivity-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

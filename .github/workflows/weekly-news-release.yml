name: Notícias oficiais e atualização semanal do APK

on:
  schedule:
    - cron: '17 9 * * 1'
      timezone: America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: headshot-weekly-news-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a branch principal
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Manter a chave persistente disponível
        id: stable-signing-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.android/debug.keystore
          key: headshot-debug-keystore-v2-${{ runner.os }}

      - name: Impedir atualização incompatível
        env:
          CACHE_HIT: ${{ steps.stable-signing-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$CACHE_HIT" != "true" || ! -s .android/debug.keystore ]]; then
            echo "::error::A chave de assinatura estável não foi recuperada. Nenhuma versão será publicada para evitar exigir desinstalação."
            exit 1
          fi
          bash scripts/verify_apk_signing.sh --keystore .android/debug.keystore

      - name: Testar o sincronizador
        run: python3 -m unittest discover -s tests -v

      - name: Buscar notícias oficiais e comparar com a versão publicada
        id: news
        run: python3 scripts/update_official_news.py --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Verificar se falta publicar a versão atual
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.news.outputs.version_name }}
          NEWS_CHANGED: ${{ steps.news.outputs.changed }}
        run: |
          set -euo pipefail
          if [[ "$NEWS_CHANGED" == "true" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v${VERSION_NAME}"
          asset_names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if printf '%s\n' "$asset_names" | grep -Fxq 'Headshot-Sensitivity.apk'; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Registrar a atualização de notícias no GitHub
        if: steps.news.outputs.changed == 'true'
        env:
          VERSION_NAME: ${{ steps.news.outputs.version_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/news_data.js app/src/main/assets/index.html app/build.gradle
          git commit -m "chore: sincroniza notícias oficiais Free Fire v${VERSION_NAME}"
          git push origin HEAD:main

      - name: Preparar Java
        if: steps.release-check.outputs.needed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        if: steps.release-check.outputs.needed == 'true'
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Aceitar licenças do Android SDK
        if: steps.release-check.outputs.needed == 'true'
        run: yes | sdkmanager --licenses || true

      - name: Compilar APK
        if: steps.release-check.outputs.needed == 'true'
        run: gradle assembleDebug --stacktrace

      - name: Validar assinatura e preparar arquivo de distribuição
        if: steps.release-check.outputs.needed == 'true'
        env:
          VERSION_NAME: ${{ steps.news.outputs.version_name }}
        run: |
          set -euo pipefail
          APK_PATH='app/build/outputs/apk/debug/app-debug.apk'
          bash scripts/verify_apk_signing.sh --apk "$APK_PATH"
          mkdir -p release
          cp "$APK_PATH" release/Headshot-Sensitivity.apk
          sha256sum release/Headshot-Sensitivity.apk

      - name: Anexar APK à GitHub Release
        if: steps.release-check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.news.outputs.version_name }}
        run: |
          set -euo pipefail
          tag="v${VERSION_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/Headshot-Sensitivity.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/Headshot-Sensitivity.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "Headshot Sensitivity ${VERSION_NAME}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Resumo da execução
        if: always()
        env:
          CHANGED: ${{ steps.news.outputs.changed }}
          RELEASE_NEEDED: ${{ steps.release-check.outputs.needed }}
          VERSION_NAME: ${{ steps.news.outputs.version_name }}
        run: |
          {
            echo '### Atualização semanal do Headshot Sensitivity'
            echo "- Notícias oficiais alteradas: ${CHANGED:-não confirmado}"
            echo "- APK publicado/pendente: ${RELEASE_NEEDED:-não confirmado}"
            echo "- Versão: ${VERSION_NAME:-não confirmada}"
          } >> "$GITHUB_STEP_SUMMARY"

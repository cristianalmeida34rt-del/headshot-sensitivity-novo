
plugins {
    id 'com.android.application'
}

def stableDebugKeystore = rootProject.file('.android/debug.keystore')

android {
    signingConfigs {
        stableDebug {
            storeFile stableDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            if (stableDebugKeystore.exists()) {
                signingConfig signingConfigs.stableDebug
            }
        }
    }

    namespace 'com.headshotsensitivity'
    compileSdk 35

    defaultConfig {
        applicationId 'com.headshotsensitivity'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}


dependencies {
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.0"
}
